<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Aqualian Piscinas. Diseño, construcción, reformas y mantenimiento de piscinas a medida."
    />

    <title>Contacto | Aqualian Piscinas</title>
    <link rel="shortcut icon" href="assets/img/logo.ico" type="image/x-icon">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="assets/css/estilos.css" />
    
  </head>

  <body>
    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">
      <div class="container">
        <!-- LOGO -->
        <a
          href="index.html"
          class="logo"
          aria-label="Aqualian Piscinas - Inicio"
        >
          <img src="assets/img/logo_texto.ico" alt="Aqualian Piscinas" />
        </a>

        <!-- NAVEGACIÓN -->
        <nav class="nav" aria-label="Navegación principal">
          <a href="index.html" class="active"> Inicio </a>

          <a href="nosotros.html">Nosotros </a>
          <a href="servicios.html"> Servicios </a>

          <a href="proyectos.html"> Proyectos </a>

          <a href="contacto.html"> Contacto </a>
        </nav>

        <!-- BOTÓN HEADER -->
        <a href="contacto.html" class="header-button">
          Solicita tu proyecto
          <span aria-hidden="true">→</span>
        </a>

        <!-- MENÚ MÓVIL -->
        <button
          class="menu-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="menu-principal"
        >
          <span></span>
          <span></span>
          <span></span>

    </header>
    <main>
<h1>Página en construcción</h1>
    </main>

     FOOTER
====================================================== -->
    <footer class="footer">
      <div class="container">
        <!-- LOGO -->
        <div class="footer-logo">
          <img
            src="assets/img/logo_texto_fondo_azul.ico"
            alt="Aqualian Piscinas"
          />
        </div>
        <!-- INFORMACIÓN DE CONTACTO -->
        <div class="footer-contact">
          <span class="footer-contact-item">
            <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
            <span> Burjassot, Valencia </span>
          </span>
          <span class="footer-contact-item">
            <i class="bi bi-envelope-fill" aria-hidden="true"></i>
            <a href="mailto:info@aqualian.com"> info@aqualian.com </a>
          </span>
        </div>
        <!-- REDES SOCIALES -->
        <div class="footer-social">
          <a
            href="https://www.instagram.com/aqualianpiscinas/"
            aria-label="Instagram Aqualian Piscinas"
            target="_blank"
          >
            <i class="bi bi-instagram"></i>
          </a>
        </div>
      </div>
